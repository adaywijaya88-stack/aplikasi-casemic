<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MedClaim & Koding Klinis — RSUD Kepulauan Seribu</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #0f766e;
      --primary-soft: #f0fdfa;
      --accent: #0284c7;
      --accent-soft: #e0f2fe;
      --warn-bg: #fffbeb;
      --warn-border: #f59e0b;
      --warn-text: #92400e;
      --danger-bg: #fef2f2;
      --danger-border: #dc2626;
      --danger-text: #991b1b;
      --ok-bg: #f0fdf4;
      --ok-border: #16a34a;
      --ok-text: #166534;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    header {
      background: linear-gradient(135deg, #0f172a 0%, #0f766e 100%);
      color: #fff;
      padding: 18px 24px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.15);
    }

    .header-inner {
      max-width: 1360px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 18px;
    }

    .header-center {
      text-align: center;
    }

    .header-logo {
      height: 52px;
      width: auto;
      max-width: 140px;
      object-fit: contain;
      background: rgba(255, 255, 255, 0.94);
      padding: 5px 9px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.2);
    }

    @media (max-width: 760px) {
      .header-inner {
        flex-direction: column;
        gap: 10px;
      }
      .header-logo {
        height: 46px;
      }
    }

    header h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
    }

    header p {
      margin: 4px 0 0;
      font-size: 0.875rem;
      color: #ccfbf1;
    }

    .container {
      max-width: 1360px;
      margin: 20px auto;
      padding: 0 20px 40px;
    }

    .toolbar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 18px;
    }

    .search-input {
      flex: 1 1 240px;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.92rem;
    }

    select, button, input[type="number"], input[type="password"], input[type="text"], textarea {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: 0.88rem;
      background: #fff;
      color: var(--text);
      font-family: inherit;
    }

    button {
      cursor: pointer;
      transition: all 0.15s ease;
    }

    button:disabled, input:disabled, textarea:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    button.btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      font-weight: 600;
    }

    button.btn-primary:hover { background: #115e59; }

    button.btn-unlock-green {
      background: #15803d;
      color: #ffffff;
      border-color: #15803d;
      font-weight: 700;
    }

    button.btn-unlock-green:hover {
      background: #166534;
      border-color: #166534;
    }

    button.btn-accent {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      font-weight: 600;
    }

    button.btn-accent:hover:not(:disabled) { background: #0369a1; }

    .top-right-controls {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .blue-action-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    button.btn-blue-pill {
      background: #0284c7;
      color: #ffffff;
      border: 1px solid #0369a1;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 1px 3px rgba(2, 132, 199, 0.25);
    }

    button.btn-blue-pill:hover {
      background: #0369a1;
      border-color: #075985;
    }

    button.btn-blue-pill.is-active {
      background: #075985;
      box-shadow: inset 0 0 0 1px #bae6fd;
    }

    .header-edit-box {
      background: #eff6ff;
      border: 1px solid #93c5fd;
      border-radius: 10px;
      padding: 12px 14px;
      margin: 10px 0 12px;
      color: #0f172a;
    }

    .header-edit-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
      margin-bottom: 10px;
    }

    .header-edit-field label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: #1e3a8a;
      margin-bottom: 4px;
    }

    .header-edit-field input[type="text"],
    .header-edit-field textarea {
      width: 100%;
      padding: 8px 10px;
      font-size: 0.86rem;
      background: #ffffff;
      border: 1px solid #60a5fa;
      color: #0f172a;
    }

    .header-edit-field textarea {
      min-height: 68px;
      resize: vertical;
    }

    .header-unlock-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 8px;
    }

    button.btn-lock {
      background: #fff7ed;
      color: #9a3412;
      border: 1px solid #fdba74;
      font-weight: 600;
    }

    button.btn-lock:hover { background: #ffedd5; }

    button.btn-save {
      background: #15803d;
      color: #fff;
      border-color: #15803d;
      font-weight: 600;
    }

    button.btn-save:hover { background: #166534; }

    button.btn-download {
      background: #1e293b;
      color: #fff;
      border-color: #1e293b;
      font-weight: 600;
    }

    button.btn-download:hover { background: #0f172a; }

    button.btn-reset-soft {
      background: #fff;
      color: #b91c1c;
      border-color: #fca5a5;
      font-weight: 600;
    }

    button.btn-reset-soft:hover { background: #fef2f2; }

    .badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
      background: #e2e8f0;
      color: #1e293b;
      flex-shrink: 0;
      text-align: center;
      max-width: 240px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .panel.panel-excluded {
      background: #fff5f5;
      border: 2px solid #dc2626;
      color: #991b1b;
    }

    .panel.panel-excluded .badge {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #f87171;
    }

    .panel.panel-excluded h2,
    .panel.panel-excluded h3,
    .panel.panel-excluded h4,
    .panel.panel-excluded strong,
    .panel.panel-excluded .excluded-muted,
    .panel.panel-excluded .excluded-proc-line,
    .panel.panel-excluded .role-feedback {
      color: #991b1b;
    }

    .panel.panel-excluded .calc-box {
      background: #fff5f5;
      border: 1px solid #f87171;
    }

    .panel.panel-excluded .sub-card {
      background: #fff5f5;
      border: 1px solid #fca5a5;
    }

    .panel.panel-excluded .check-label {
      background: #ffffff;
      border: 1px solid #fca5a5;
      color: #991b1b;
    }

    .panel.panel-excluded .check-label:has(input:checked) {
      background: #fee2e2;
      border-color: #dc2626;
      color: #7f1d1d;
      font-weight: 600;
    }

    .panel.panel-excluded .alert.alert-ok,
    .panel.panel-excluded .alert.alert-warn,
    .panel.panel-excluded .score-pill.alert-ok,
    .panel.panel-excluded .score-pill.alert-warn {
      background: #fee2e2;
      border: 1px solid #f87171;
      color: #991b1b;
    }

    .panel.panel-excluded .score-pill.alert-danger {
      background: #fecaca;
      border: 1.5px solid #dc2626;
      color: #7f1d1d;
    }

    .panel.panel-excluded .icd-code-btn {
      background: #dc2626;
      color: #ffffff;
      border-color: #b91c1c;
    }

    .panel.panel-excluded .icd-code-btn:hover {
      background: #b91c1c;
    }

    .panel.panel-excluded .icd-code-btn.active {
      background: #dc2626;
      color: #ffffff;
      border-color: #991b1b;
      box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.25);
    }

    .panel.panel-excluded input[type="number"],
    .panel.panel-excluded input[type="password"] {
      background: #ffffff;
      border: 1.5px solid #fca5a5;
      color: #991b1b;
      font-weight: 500;
    }

    .panel.panel-excluded button.btn-accent {
      background: #f87171;
      border-color: #f87171;
      color: #ffffff;
    }

    .panel.panel-excluded button.btn-accent:hover:not(:disabled) {
      background: #ef4444;
      border-color: #ef4444;
    }

    .panel.panel-excluded .unlock-box {
      border-top: 1px dashed #fca5a5;
    }

    .panel.panel-excluded .action-bar {
      border-top: 1px dashed #f87171;
    }

    .panel.panel-excluded button.btn-save {
      background: #b91c1c;
      border-color: #991b1b;
      color: #ffffff;
    }

    .panel.panel-excluded button.btn-save:hover {
      background: #991b1b;
    }

    .panel.panel-excluded button.btn-download {
      background: #7f1d1d;
      border-color: #7f1d1d;
      color: #ffffff;
    }

    .panel.panel-excluded button.btn-download:hover {
      background: #450a0a;
    }

    .panel.panel-excluded button.btn-reset-soft {
      background: #fee2e2;
      color: #991b1b;
      border-color: #dc2626;
    }

    .panel.panel-excluded button.btn-reset-soft:hover {
      background: #fecaca;
    }

    .alert {
      border-radius: 10px;
      padding: 12px 14px;
      margin: 12px 0;
      font-size: 0.88rem;
    }

    .alert-danger {
      background: #fee2e2;
      border: 1.5px solid #f87171;
      color: var(--danger-text);
      font-weight: 700;
    }

    .alert-warn {
      background: var(--warn-bg);
      border: 1px solid var(--warn-border);
      color: var(--warn-text);
    }

    .alert-ok {
      background: var(--ok-bg);
      border: 1px solid var(--ok-border);
      color: var(--ok-text);
    }

    .calc-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-top: 14px;
    }

    .calc-box h3 {
      margin: 0 0 10px;
      font-size: 1rem;
      color: var(--primary);
    }

    .sub-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      margin-top: 10px;
    }

    .sub-card h4 {
      margin: 0 0 8px;
      font-size: 0.92rem;
      font-weight: 700;
      color: #0f172a;
    }

    .tariff-header-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .lock-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.76rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
    }

    .lock-pill.locked {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fca5a5;
    }

    .lock-pill.unlocked {
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #86efac;
    }

    .unlock-box {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #cbd5e1;
    }

    .lock-msg {
      font-size: 0.82rem;
      font-weight: 600;
      margin-top: 6px;
      min-height: 1.2em;
    }

    .osce-comp-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 8px 0;
    }

    .osce-comp-card {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      padding: 10px 12px;
    }

    .osce-comp-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .osce-comp-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: #0f172a;
    }

    .osce-comp-points {
      font-size: 0.78rem;
      color: #475569;
      margin-bottom: 6px;
    }

    .osce-rubric-note {
      font-size: 0.76rem;
      color: #334155;
      background: #ffffff;
      border: 1px dashed #cbd5e1;
      border-radius: 6px;
      padding: 6px 9px;
    }

    .viral-criteria-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 8px 0;
    }

    .viral-chk-card {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.85rem;
      color: #0f172a;
      cursor: pointer;
    }

    .viral-chk-card.sub-indent {
      margin-left: 18px;
      background: #f8fafc;
    }

    @media (max-width: 600px) {
      .viral-chk-card.sub-indent {
        margin-left: 10px;
      }
    }

    .viral-chk-card input[type="checkbox"] {
      width: 15px;
      height: 15px;
      margin-top: 2px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .viral-chk-card:has(input:checked) {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: #115e59;
    }

    .ppok-xray-strip {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 10px 14px;
      margin: 8px 0 10px;
      font-size: 0.88rem;
      color: #0f172a;
      cursor: pointer;
    }

    .ppok-xray-strip input[type="checkbox"] {
      width: 15px;
      height: 15px;
      margin: 0;
      cursor: pointer;
      flex-shrink: 0;
    }

    .ppok-xray-strip:has(input:checked) {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: #115e59;
    }

    .puqe-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 10px;
      margin: 8px 0;
    }

    .puqe-field label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 4px;
    }

    .puqe-field select {
      width: 100%;
    }

    .icd-code-btn {
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      background: #f1f5f9;
      color: #0f172a;
      border: 1px solid #cbd5e1;
    }

    .icd-code-btn:hover {
      background: #e2e8f0;
    }

    .icd-code-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .check-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 8px;
      margin: 10px 0;
    }

    .check-label {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      background: #fff;
      border: 1px solid var(--border);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.84rem;
      cursor: pointer;
    }

    .check-label:has(input:checked) {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: #115e59;
      font-weight: 600;
    }

    .score-pill {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      margin-top: 8px;
    }

    .slide11-wrap {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-left: 5px solid #0284c7;
      border-radius: 12px;
      padding: 16px;
      margin-top: 14px;
    }

    .slide11-tag {
      display: inline-block;
      background: #dcfce7;
      color: #15803d;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      padding: 3px 10px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .slide11-title {
      margin: 6px 0 14px;
      font-size: 1.25rem;
      font-weight: 800;
      color: #0f172a;
    }

    .slide11-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 14px;
    }

    .slide11-card-blue {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      padding: 14px;
    }

    .slide11-card-green {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      border-radius: 10px;
      padding: 14px;
    }

    .slide11-card-head {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 10px;
    }

    .slide11-chk-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      background: #ffffff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 7px 10px;
      margin-bottom: 7px;
      font-size: 0.83rem;
      color: #1e293b;
      cursor: pointer;
    }

    .slide11-chk-row:has(input:checked) {
      background: #dbeafe;
      border-color: #0284c7;
      font-weight: 600;
    }

    .slide11-code-box {
      background: #e0f2fe;
      border: 1px solid #bae6fd;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.82rem;
      color: #0f172a;
      margin-top: 8px;
    }

    .slide11-code-pill {
      display: inline-block;
      background: #0284c7;
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 5px;
      margin-bottom: 4px;
    }

    .slide11-strip {
      display: block;
      background: #ffffff;
      border: 1px solid #d1fae5;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 8px;
      font-size: 0.83rem;
      cursor: pointer;
    }

    .slide11-strip:has(input:checked) {
      background: #d1fae5;
      border-color: #059669;
    }

    .slide11-strip-top {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .slide11-strip-head {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      font-weight: 700;
      color: #0f172a;
    }

    .pill-tag {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 5px;
    }

    .pill-blue { background: #dbeafe; color: #1d4ed8; }
    .pill-teal { background: #ccfbf1; color: #0f766e; }
    .pill-amber { background: #fef3c7; color: #b45309; }

    .slide11-strip-sub {
      font-size: 0.78rem;
      color: #475569;
      margin-top: 3px;
    }

    .slide11-phases {
      background: #d1fae5;
      border-radius: 8px;
      padding: 10px;
      margin-top: 10px;
      text-align: center;
    }

    .slide11-phases-title {
      font-size: 0.8rem;
      font-weight: 800;
      color: #065f46;
      margin-bottom: 6px;
    }

    .slide11-phases-flow {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .phase-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #ffffff;
      color: #047857;
      border: 1px solid #6ee7b7;
      padding: 3px 9px;
      border-radius: 999px;
      cursor: pointer;
    }

    .phase-chip:has(input:checked) {
      background: #059669;
      color: #ffffff;
      border-color: #059669;
    }

    .slide11-footer {
      background: #d1fae5;
      border: 1px solid #a7f3d0;
      border-radius: 8px;
      padding: 10px 12px;
      margin-top: 12px;
      font-size: 0.82rem;
      color: #064e3b;
    }

    .slide11-summary {
      display: inline-block;
      margin-top: 10px;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.84rem;

    const DEFAULT_DIAG_META = Object.fromEntries(
      DIAGNOSES.map((d) => [d.id, { name: d.name, icd10: d.icd10, note: d.note }])
    );

    let selectedId = "";
    let roleFeedbackMsg = "";
    let savedState = loadSavedState();

    function getTariffMultiplier() {
      const raw = document.getElementById("eclaimClassSelect")?.value;
      const val = parseFloat(raw || "1.0");
      return Number.isFinite(val) && val > 0 ? val : 1.0;
    }

    function getAdjustedClaim(baseClaim) {
      if (!baseClaim || baseClaim <= 0) return 0;
      return Math.round(baseClaim * getTariffMultiplier());
    }

    const formatRp = (num) => {
      if (!num || num <= 0) return "Tidak Berlaku / Dikecualikan";
      return "Rp " + Number(num).toLocaleString("id-ID");
    };

    function loadSavedState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          return {
            selectedId: "",
            tariffMultiplier: "",
            customTariffs: {},
            codeOverrides: {},
            formValues: {},
            lastSavedAt: null
          };
        }
        const parsed = JSON.parse(raw);
        const codeOverrides = parsed.codeOverrides || {};
        if (parsed.pneumoniaCodeOverride && !codeOverrides.pneumonia) {
          codeOverrides.pneumonia = parsed.pneumoniaCodeOverride;
        }
        return {
          selectedId: typeof parsed.selectedId === "string" ? parsed.selectedId : "",
          tariffMultiplier: typeof parsed.tariffMultiplier === "string" ? parsed.tariffMultiplier : "",
          customTariffs: parsed.customTariffs || {},
          codeOverrides,
          formValues: parsed.formValues || {},
          lastSavedAt: parsed.lastSavedAt || null
        };
      } catch {
        return {
          selectedId: "",
          tariffMultiplier: "",
          customTariffs: {},
          codeOverrides: {},
          formValues: {},
          lastSavedAt: null
        };
      }
    }

    function applySavedOverridesToDiagnoses() {
      if (savedState.customTariffs) {
        DIAGNOSES.forEach((d) => {
          if (Object.prototype.hasOwnProperty.call(savedState.customTariffs, d.id)) {
            const savedVal = Number(savedState.customTariffs[d.id]);
            const defaultVal = ECLAIM_TARIFF_MAP[d.id];
            if (d.id.startsWith("stt_") && defaultVal === 2880700 && savedVal === 2007700) {
              d.claim = defaultVal;
              delete savedState.customTariffs[d.id];
            } else {
              d.claim = savedVal || 0;
            }
          }
        });
      }
      if (savedState.codeOverrides) {
        Object.entries(savedState.codeOverrides).forEach(([diagId, ov]) => {
          const target = DIAGNOSES.find((d) => d.id === diagId);
          if (target && ov) {
            if (typeof ov.icd10 === "string" && ov.icd10.trim()) target.icd10 = ov.icd10;
            if (typeof ov.name === "string" && ov.name.trim()) target.name = ov.name;
            if (typeof ov.note === "string") target.note = ov.note;
          }
        });
      }
    }

      const el = document.getElementById("headerLockMsg");

      el.style.color = headerLockIsError ? "#b91c1c" : "#1d4ed8";

      if (!isHeaderCardUnlocked) {
        showHeaderUnlockPrompt = true;
        isHeaderCardEditing = false;
        headerLockIsError = false;
        headerLockMsgText = "Masukkan password untuk membuka kunci dan mengedit data diagnosis.";
        renderDetail();
        setTimeout(() => document.getElementById("headerUnlockPassword")?.focus(), 0);
        return;
      }
      isHeaderCardEditing = !isHeaderCardEditing;
      showHeaderUnlockPrompt = false;
      headerLockIsError = false;
      headerLockMsgText = isHeaderCardEditing
        ? "Mode edit aktif: silakan ketik/ubah Nama Diagnosis, Kode ICD-10, atau Catatan."
        : "Mode edit ditutup.";
      renderDetail();
      if (isHeaderCardEditing) {
        setTimeout(() => document.getElementById("headerEditNameInput")?.focus(), 0);
      }
    }

    function handleTopLockClick() {
      if (isHeaderCardUnlocked) {
        isHeaderCardUnlocked = false;
        isHeaderCardEditing = false;
        showHeaderUnlockPrompt = false;
        headerLockIsError = false;
        headerLockMsgText = "Bagian diagnosis telah dikunci.";
        renderDetail();
        return;
      }
      showHeaderUnlockPrompt = !showHeaderUnlockPrompt;
      headerLockIsError = false;
      headerLockMsgText = showHeaderUnlockPrompt

    function unlockHeaderCard() {
      const input = document.getElementById("headerUnlockPassword");
      const val = (input?.value || "").trim().toLowerCase();
      if (val === TARIFF_UNLOCK_PASS) {
        isHeaderCardUnlocked = true;
        isHeaderCardEditing = true;
        showHeaderUnlockPrompt = false;
        headerLockIsError = false;
        headerLockMsgText = "Kunci dibuka. Anda dapat mengetik langsung pada kolom Nama Diagnosis, ICD-10, dan Catatan.";
        renderDetail();
        setTimeout(() => document.getElementById("headerEditNameInput")?.focus(), 0);
      } else {
        isHeaderCardUnlocked = false;
        headerLockIsError = true;
        headerLockMsgText = "Password salah. Silakan coba lagi.";
        renderHeaderLockMsg();
        input?.focus();
      }
    }

    function saveHeaderCardEdit(diagId) {
      if (!isHeaderCardUnlocked) return;
      const diag = DIAGNOSES.find((d) => d.id === diagId);
      if (!diag) return;

      const nameVal = (document.getElementById("headerEditNameInput")?.value || "").trim();
      const icdVal = (document.getElementById("headerEditIcdInput")?.value || "").trim();
      const noteVal = (document.getElementById("headerEditNoteInput")?.value || "").trim();

      if (!nameVal || !icdVal) {
        headerLockIsError = true;
        headerLockMsgText = "Nama Diagnosis dan Kode ICD-10 tidak boleh kosong.";
        renderHeaderLockMsg();
        return;
      }

      diag.name = nameVal;
      diag.icd10 = icdVal;
      diag.note = noteVal;

      savedState.codeOverrides[diagId] = {
        name: diag.name,
        icd10: diag.icd10,
        note: diag.note
      };
      if (diagId === "pneumonia") {
        savedState.pneumoniaCodeOverride = {
          name: diag.name,
          icd10: diag.icd10,
          note: diag.note
        };
      }

      isHeaderCardEditing = false;
      headerLockIsError = false;
      headerLockMsgText = "Perubahan diagnosis berhasil disimpan.";
      roleFeedbackMsg = `Data diagnosis "${diag.name}" (${diag.icd10}) berhasil diperbarui.`;
      saveAllData(false);
      syncDiagnosisSelector();
      renderDetail();
    }

    function applyCustomTariff(diagId) {
      if (!isTariffUnlocked) {
        tariffLockIsError = true;
        tariffLockMsgText = "Bagian Penyesuaian Tarif Dasar E-Klaim sedang terkunci. Buka kunci terlebih dahulu.";
        renderTariffLockMsg();
        return;
      }

      const input = document.getElementById("customTariffInput");
      const rawVal = Number(input?.value);
      if (!Number.isFinite(rawVal) || rawVal < 0) {
        roleFeedbackMsg = "Masukkan nominal tarif E-Klaim yang valid (angka >= 0).";
        updateRoleFeedback();
        return;
      }
      const diag = DIAGNOSES.find((d) => d.id === diagId);
      if (!diag) return;
      diag.claim = Math.round(rawVal);
      savedState.customTariffs[diagId] = diag.claim;
      saveAllData(false);
      roleFeedbackMsg = `Tarif dasar E-Klaim untuk "${diag.name}" diperbarui menjadi ${formatRp(diag.claim)}.`;
      syncDiagnosisSelector();
      renderDetail();
    }

    function captureCurrentFormValues(diagId) {
      if (!diagId) return;
      if (!savedState.formValues[diagId]) {
        savedState.formValues[diagId] = { checks: {}, selects: {} };
      }
      const bucket = savedState.formValues[diagId];

      document.querySelectorAll("#detailPanel input[type='checkbox']").forEach((chk, idx) => {
        const key = chk.id || `${diagId}_chk_${idx}`;
        bucket.checks[key] = chk.checked;
      });

      document.querySelectorAll("#detailPanel select").forEach((sel, idx) => {
        const key = sel.id || `${diagId}_sel_${idx}`;
        bucket.selects[key] = sel.value;
      });
    }

    function restoreFormValues(diagId) {
      const bucket = savedState.formValues[diagId];
      if (!bucket) return;

      document.querySelectorAll("#detailPanel input[type='checkbox']").forEach((chk, idx) => {
        const key = chk.id || `${diagId}_chk_${idx}`;
        if (Object.prototype.hasOwnProperty.call(bucket.checks, key)) {
          chk.checked = Boolean(bucket.checks[key]);
        }
      });

      document.querySelectorAll("#detailPanel select").forEach((sel, idx) => {
        const key = sel.id || `${diagId}_sel_${idx}`;
        if (Object.prototype.hasOwnProperty.call(bucket.selects, key)) {
          sel.value = bucket.selects[key];
        }
      });
    }

    function saveAllData(showMessage = true) {
      captureCurrentFormValues(selectedId);
      savedState.selectedId = selectedId;
      savedState.tariffMultiplier = document.getElementById("eclaimClassSelect")?.value ?? "";
      savedState.lastSavedAt = new Date().toLocaleString("id-ID");

      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(savedState));
        if (showMessage) {
          roleFeedbackMsg = `Data berhasil disimpan (${savedState.lastSavedAt}).`;
          updateRoleFeedback();
        }
      } catch {
        if (showMessage) {
          roleFeedbackMsg = "Gagal menyimpan ke penyimpanan lokal browser.";
          updateRoleFeedback();
        }
      }
    }

    function resetDiagData(diagId) {
      delete savedState.formValues[diagId];
      delete savedState.customTariffs[diagId];
      delete savedState.codeOverrides[diagId];
      if (diagId === "pneumonia") {
        savedState.pneumoniaCodeOverride = null;
      }
      const diag = DIAGNOSES.find((d) => d.id === diagId);
      const meta = DEFAULT_DIAG_META[diagId];
      if (diag) {
        if (Object.prototype.hasOwnProperty.call(ECLAIM_TARIFF_MAP, diagId)) {
          diag.claim = ECLAIM_TARIFF_MAP[diagId];
        }
        if (meta) {
          diag.name = meta.name;
          diag.icd10 = meta.icd10;
          diag.note = meta.note;
        }
      }
      isHeaderCardEditing = false;
      saveAllData(false);
      syncDiagnosisSelector();
      renderDetail();
      roleFeedbackMsg = "Data checklist, koding ICD-10 & tarif pada diagnosis ini telah direset.";
      updateRoleFeedback();
    }

    function triggerFileDownload(filename, content, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

        const container = el.closest(".slide11-strip") || el.parentElement;
        return container ? container.textContent.trim().replace(/\s+/g, " ") : "Tercentang";
      });

    function getSelectSummariesInDetail() {
      return [...document.querySelectorAll("#detailPanel select")].map((sel) => {
        const label = sel.dataset.selectLabel ? `${sel.dataset.selectLabel}: ` : "";
        const optText = sel.selectedOptions?.[0]?.textContent?.trim() || sel.value;
        return `${label}${optText}`;
      });

    function buildDiagnosisReportText(diag) {
      captureCurrentFormValues(diag.id);
      const checked = getCheckedLabelsInDetail();
      const selects = getSelectSummariesInDetail();
      const modeLabel = document.getElementById("eclaimClassSelect")?.selectedOptions?.[0]?.textContent?.trim() || "- pilih -";

      const lines = [
        "=== LAPORAN KRITERIA & KODING KLINIS — RSUD KEPULAUAN SERIBU ===",
        `Waktu Cetak       : ${new Date().toLocaleString("id-ID")}`,
        `Kelompok Tarif    : ${modeLabel}`,
        `Diagnosis         : ${diag.name}`,
        `Kategori          : ${diag.category}`,
        `Kode ICD-10       : ${diag.icd10}`,
        `Tindakan/Prosedur : ${diag.procedures}`,
        `Estimasi Klaim    : ${formatRp(getAdjustedClaim(diag.claim))} (Tarif E-Klaim: ${formatRp(diag.claim)})`,
        `Catatan Regulasi  : ${diag.note}`,
        ""

      if (selects.length) {
        lines.push("Pilihan Kriteria/Skor:");
        selects.forEach((s) => lines.push(`- ${s}`));
        if (diag.id === "heg") {
          const puqeSummary = document.getElementById("puqeResult")?.textContent?.trim();
          if (puqeSummary) lines.push(`- Hasil ${puqeSummary}`);
        }
        if (diag.id === "ppok") {
          const ppokSummary = document.getElementById("ppokCriteriaResult")?.textContent?.trim();
          const goldSummary = document.getElementById("ppokGoldResult")?.textContent?.trim();
          if (ppokSummary) lines.push(`- ${ppokSummary}`);
          if (goldSummary) lines.push(`- ${goldSummary}`);
        }
        if (diag.id === "tb_paru") {
          const tbDiagSummary = document.getElementById("tbDiagResult")?.textContent?.trim();
          const tbOsceSummary = document.getElementById("tbOsceScoreResult")?.textContent?.trim();
          if (tbDiagSummary) lines.push(`- ${tbDiagSummary}`);
          if (tbOsceSummary) lines.push(`- ${tbOsceSummary}`);
        }
        lines.push("");
      }

      if (diag.id === "peb_severe") {
        const pebMinSummary = document.getElementById("pebMinimalResult")?.textContent?.trim();
        const pebSevSummary = document.getElementById("pebSevereResult")?.textContent?.trim();
        if (pebMinSummary || pebSevSummary) {
          lines.push("Ringkasan Kriteria Diagnosis Preeklampsia (PNPK):");
          if (pebMinSummary) lines.push(`- ${pebMinSummary}`);
          if (pebSevSummary) lines.push(`- ${pebSevSummary}`);
          lines.push("");

      if (diag.id === "bacterial_inf") {

        if (bacSummary) {
          lines.push(`Ringkasan Kriteria Bacterial Infection: ${bacSummary}`);

        }

        const asmaSummary = document.getElementById("asmaCriteriaResult")?.textContent?.trim();
        if (asmaSummary) {
          lines.push(`Ringkasan Kriteria Asma: ${asmaSummary}`);
          lines.push("");
        }
      }

      if (diag.id === "isk") {
        const iskLowerSummary = document.getElementById("iskLowerResult")?.textContent?.trim();
        const iskUpperSummary = document.getElementById("iskUpperResult")?.textContent?.trim();
        if (iskLowerSummary || iskUpperSummary) {
          lines.push("Ringkasan Kriteria ISK:");
          if (iskLowerSummary) lines.push(`- ${iskLowerSummary}`);
          if (iskUpperSummary) lines.push(`- ${iskUpperSummary}`);
          lines.push("");
        }
      }

      if (diag.id === "viral_inf") {
        const viralSummary = document.getElementById("viralCriteriaResult")?.textContent?.trim();
        if (viralSummary) {
          lines.push(`Ringkasan Kriteria: ${viralSummary}`);
          lines.push("");

      if (diag.id === "malaria") {

        const malSevereSummary = document.getElementById("malariaSevereResult")?.textContent?.trim();
        if (malDiagSummary || malSevereSummary) {

          if (malDiagSummary) lines.push(`- ${malDiagSummary}`);
          if (malSevereSummary) lines.push(`- ${malSevereSummary}`);

      lines.push(`Checklist Terpilih (${checked.length}):`);

        lines.push("- Tidak ada item yang dicentang");

      return lines.join("\n");

      saveAllData(false);

      triggerFileDownload(`kriteria_${diag.id}_rsud_kep_seribu.txt`, text, "text/plain;charset=utf-8");

    function getSearchRelevanceScore(diag, q) {
      const name = (diag.name || "").toLowerCase();
      const baseName = (DEFAULT_DIAG_META[diag.id]?.name || diag.name || "").toLowerCase();
      const icd10 = (diag.icd10 || "").toLowerCase();
      const procedures = (diag.procedures || "").toLowerCase();
      const note = (diag.note || "").toLowerCase();
      const extraOptions = (ICD10_OPTIONS_BY_DIAG[diag.id] || [])
        .map((o) => `${o.code} ${o.label}`.toLowerCase())
        .join(" ");

      if (name.startsWith(q) || baseName.startsWith(q)) return 100;
      if (icd10.startsWith(q)) return 90;
      if (name.includes(q) || baseName.includes(q)) return 80;
      if (icd10.includes(q)) return 70;
      if (extraOptions.includes(q)) return 50;
      if (procedures.includes(q) || note.includes(q)) return 30;
      return 0;
    }

    function getFilteredDiagnoses() {
      const q = document.getElementById("searchInput").value.trim().toLowerCase();
      const cat = document.getElementById("categoryFilter").value;

      const byCat = DIAGNOSES.filter((d) => cat === "ALL" || d.category === cat);
      if (!q) return byCat;

      return byCat
        .map((d) => ({ diag: d, score: getSearchRelevanceScore(d, q) }))
        .filter((item) => item.score > 0)
        .sort((a, b) => b.score - a.score)
        .map((item) => item.diag);
    }

    function syncDiagnosisSelector() {
      const sel = document.getElementById("diagQuickSelect");
      const filtered = getFilteredDiagnoses();
      const q = document.getElementById("searchInput").value.trim().toLowerCase();

      if (!filtered.length) {
        sel.innerHTML = `<option value="">-diagnosa-</option>`;
        selectedId = "";
        return;
      }

      if (q) {
        selectedId = filtered[0].id;
      } else if (selectedId && !filtered.some((d) => d.id === selectedId)) {
        selectedId = "";
      }

      const optionsHtml =
        `<option value="">-diagnosa-</option>` +
        filtered.map((d) => `<option value="${d.id}">${d.name} (${d.icd10})</option>`).join("");
      sel.innerHTML = optionsHtml;
      sel.value = selectedId || "";
    }

    function applyDiagnosisCode(diagId, code, label) {
      const diag = DIAGNOSES.find((d) => d.id === diagId);
      if (!diag) return;
      const baseName = (DEFAULT_DIAG_META[diagId]?.name || diag.name).split(" (")[0];
      const nextName =
        diagId === "pneumonia"
          ? "Pneumonia"
          : label && label !== baseName
            ? `${baseName} (${label})`
            : baseName;
      diag.icd10 = code;
      diag.name = nextName;
      savedState.codeOverrides[diagId] = { icd10: diag.icd10, name: diag.name, note: diag.note };
      if (diagId === "pneumonia") {
        savedState.pneumoniaCodeOverride = { icd10: diag.icd10, name: diag.name, note: diag.note };
      }
      saveAllData(false);
      roleFeedbackMsg = `Koding ICD-10 ${baseName} diperbarui menjadi ${code} (${label}).`;
      syncDiagnosisSelector();
      renderDetail();
    }

    function getIcd10OptionsForDiag(diag) {
      if (ICD10_OPTIONS_BY_DIAG[diag.id]) {
        return ICD10_OPTIONS_BY_DIAG[diag.id];
      }
      const defaultMeta = DEFAULT_DIAG_META[diag.id];
      const primaryCode = defaultMeta?.icd10 || diag.icd10;
      const baseLabel = defaultMeta?.name || diag.name;
      const list = [{ code: primaryCode, label: baseLabel }];
      if (diag.icd10.trim() !== primaryCode.trim()) {
        list.push({ code: diag.icd10, label: diag.name });
      }
      return list;
    }

    function renderIcd10Section(diag, headingText) {
      const options = getIcd10OptionsForDiag(diag);
      const baseName = (DEFAULT_DIAG_META[diag.id]?.name || diag.name).split(" (")[0];
      const title = headingText || `Koding ICD-10 ${baseName}`;
      return `
        <div class="sub-card">
          <h4>${title}</h4>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            ${options
              .map((opt) => {
                const isActive = diag.icd10.trim() === opt.code.trim();
                const safeCode = opt.code.replace(/'/g, "\\'");
                const safeLabel = opt.label.replace(/'/g, "\\'");
                return `<button class="icd-code-btn ${isActive ? "active" : ""}" type="button" onclick="applyDiagnosisCode('${diag.id}', '${safeCode}', '${safeLabel}')">${opt.code} (${opt.label})</button>`;
              })
              .join("")}
          </div>
        </div>
      `;
    }

    function updateInacbgsCalc() {
      const all = document.querySelectorAll(".inacbgs-chk");
      const checked = document.querySelectorAll(".inacbgs-chk:checked").length;
      const el = document.getElementById("inacbgsCriteriaResult");
      if (!el || !all.length) return;
      const isExcluded = Boolean(document.getElementById("detailPanel")?.classList.contains("panel-excluded"));
      const complete = checked === all.length;
      el.className = "score-pill " + (isExcluded ? "alert-danger" : complete ? "alert-ok" : "alert-warn");
      el.textContent = isExcluded
        ? `Kelengkapan INA-CBGs: ${checked}/${all.length} kriteria — PERINGATAN: Diagnosis dikecualikan`
        : complete
          ? `Kelengkapan INA-CBGs: ${checked}/${all.length} kriteria TERPENUHI (Siap verifikasi koding & klaim)`
          : `Kelengkapan INA-CBGs: ${checked}/${all.length} kriteria terverifikasi (lengkapi seluruh poin INA-CBGs)`;

      if (diag.module === "ppok") {

          "Debu atau bahan kimia di tempat kerja",

                <span><strong>Spirometri (Wajib):</strong> Rasio <strong>FEV1/FVC pasca-bronkodilator &lt; 0,70</strong> (atau &lt; 70%) menunjukkan hambatan aliran udara menetap</span>

            </div>
            ${renderIcd10Section(diag, "3. Koding ICD-10 PPOK")}
            ${renderInacbgsBpjsCriteriaCard(diag)}
          </div>`;
      }

      if (diag.module === "heg") {
        const hegChecklist = [
          "Mual & muntah berat persisten pada kehamilan",
          "Tanda dehidrasi klinis (turgor menurun, mukosa kering, oliguria)",

        return `
          <div class="calc-box">
            <h3>Kriteria Diagnosis HEG &amp; Kalkulator Skor PUQE (24 Jam Terakhir)</h3>
            <div class="sub-card">

                Mengukur durasi mual, frekuensi muntah, dan muntah kering (<em>retching</em>) dalam <strong>24 jam terakhir</strong> — interpretasi: <strong>&le; 6 ringan</strong>, <strong>7–12 sedang</strong>, <strong>13–15 berat</strong>.

      if (diag.module === "pneumonia") {

          "Batuk bertambah",
          "Dahak berubah / purulen",
          "Suhu >38°C atau riwayat demam",

          "Leukosit >10.000 atau <4.500"
        ];
        const curbItems = [
          "C — Confusion (kesadaran menurun)",
          "U — Urea / BUN tinggi (> 7 mmol/L)",
          "R — Respiratory rate >= 30x/menit",
          "B — Blood pressure (TD sistolik < 90 atau diastolik <= 60 mmHg)",
          "Usia >= 65 tahun"
        ];
        const psiIndications = [
          "RR >30x/menit",
          "PaO2/FiO2 <250",

          "TD sistolik <90 mmHg"

        return `

      if (diag.module === "dengue") {
        return `

      if (diag.module === "typhoid") {
        const nelwanItems = [

      if (diag.module === "gea") {

          "Dehidrasi sedang-berat (Skor Daldiyono >= 3)",

          "Immunocompromised",
          "Komplikasi diare akut",
          "Perlu pemeriksaan lab / analisa feses"

        return `
          <div class="calc-box">
            <h3>Kalkulator Skor Daldiyono &amp; Indikasi Rawat Inap GEA</h3>

      if (diag.module === "wound") {

                  <span>Luka kronis multidisiplin — evaluasi gangguan vaskuler (ada/tidak jaringan nekrotik)</span>
                </label>
                <label class="slide11-chk-row">
                  <input type="checkbox" class="wound-chk" data-chk-label="Ulkus Diabetikum: Tanpa infeksi & nekrotik -> kontrol DPJP maks 1x/bulan" onchange="updateWoundCalc()">
                  <span>Tanpa infeksi &amp; nekrotik &rarr; kontrol DPJP maks 1&times;/bulan</span>
                </label>
                <div class="slide11-code-box">
                  <div class="slide11-code-pill">Koding INA-CBG</div>
                  <div><strong>DM + ulkus/gangren/angiopati &rarr; E10–E14 karakter ke-4: .5</strong></div>

                </div>
              </div>
              <div class="slide11-card-green">

      return `

    function updatePebSevereCalc() {
      const htMinOk = Boolean(document.getElementById("pebMinHtChk")?.checked);
      const protMinOk = Boolean(document.getElementById("pebMinProtChk")?.checked);
      const altMinCount = document.querySelectorAll(".peb-min-alt-chk:checked").length;
      const minEl = document.getElementById("pebMinimalResult");

      if (minEl) {
        const minMetWithProtein = htMinOk && protMinOk;
        const minMetWithoutProtein = htMinOk && altMinCount >= 1;
        const minMet = minMetWithProtein || minMetWithoutProtein;
        minEl.className = "score-pill " + (minMet ? "alert-ok" : "alert-warn");
        if (minMetWithProtein) {
          minEl.textContent = `Kriteria Minimal Preeklampsia TERPENUHI (Hipertensi >=140/90 + Protein urin${altMinCount > 0 ? ` + ${altMinCount} kondisi penyerta` : ""})`;
        } else if (minMetWithoutProtein) {
          minEl.textContent = `Kriteria Minimal Preeklampsia TERPENUHI tanpa protein urin (Hipertensi >=140/90 + ${altMinCount}/6 kondisi klinis/penunjang)`;
        } else {
          minEl.textContent = `Kriteria Minimal Preeklampsia: Hipertensi >=140/90 (${htMinOk ? "Ya" : "Belum"}) | Protein urin (${protMinOk ? "Ya" : "Belum"}) | Alternatif tanpa protein urin: ${altMinCount}/6`;
        }
      }

      const allSev = document.querySelectorAll(".peb-sev-chk");
      const checkedSev = document.querySelectorAll(".peb-sev-chk:checked").length;
      const sevEl = document.getElementById("pebSevereResult");

      if (sevEl && allSev.length) {
        const sevMet = checkedSev >= 1;
        sevEl.className = "score-pill " + (sevMet ? "alert-danger" : "alert-warn");
        sevEl.textContent = sevMet
          ? `Kriteria Preeklampsia Berat TERPENUHI (${checkedSev}/${allSev.length} kondisi klinis tercentang — minimal 1 kondisi terpenuhi)`
          : `Kriteria Preeklampsia Berat: 0/${allSev.length} kondisi klinis tercentang (Butuh minimal 1 kondisi klinis)`;
      }

      captureCurrentFormValues("peb_severe");
    }

    function updateBacterialInfCalc() {
      const all = document.querySelectorAll(".bac-crit-chk");
      const checked = document.querySelectorAll(".bac-crit-chk:checked").length;
      const el = document.getElementById("bacterialCriteriaResult");
      if (!el || !all.length) return;
      const complete = checked === all.length;
      el.className = "score-pill " + (complete ? "alert-ok" : "alert-warn");
      el.textContent = complete
        ? `Ceklist Kriteria Bacterial Infection: ${checked}/${all.length} poin TERPENUHI`
        : `Ceklist Kriteria Bacterial Infection: ${checked}/${all.length} poin tercentang`;
      captureCurrentFormValues("bacterial_inf");
    }

    function updateAsmaCalc() {
      const all = document.querySelectorAll(".asma-crit-chk");
      const checked = document.querySelectorAll(".asma-crit-chk:checked").length;
      const el = document.getElementById("asmaCriteriaResult");
      if (!el || !all.length) return;
      const anamnesisOk = Boolean(document.getElementById("asmaAnamnesisChk")?.checked);
      const igdOk = Boolean(document.getElementById("asmaOksigenasiChk")?.checked);
      const penunjangSubCount = [
        Boolean(document.getElementById("asmaPefChk")?.checked),
        Boolean(document.getElementById("asmaThoraxChk")?.checked),
        Boolean(document.getElementById("asmaLabAgdChk")?.checked)
      ].filter(Boolean).length;
      const penunjangOk = Boolean(document.getElementById("asmaPenunjangHeadChk")?.checked) || penunjangSubCount >= 1;
      const ready = anamnesisOk && igdOk && penunjangOk;
      el.className = "score-pill " + (ready ? "alert-ok" : "alert-warn");
      el.textContent = ready
        ? `Kelayakan Rawat Inap Asma: ${checked}/${all.length} poin tercentang — Kriteria utama (Anamnesis/Fisik, Oksigenasi/IGD & Penunjang) TERPENUHI`
        : `Kelayakan Rawat Inap Asma: ${checked}/${all.length} poin tercentang (Anamnesis/Fisik: ${anamnesisOk ? "Ya" : "Belum"} | Oksigenasi/IGD: ${igdOk ? "Ya" : "Belum"} | Penunjang: ${penunjangOk ? "Ya" : "Belum"})`;
      captureCurrentFormValues("asma");
    }

    function updateIskCalc() {
      const allLower = document.querySelectorAll(".isk-lower-chk");
      const checkedLower = document.querySelectorAll(".isk-lower-chk:checked").length;
      const lowerEl = document.getElementById("iskLowerResult");

    function updateTbParuCalc() {
      const allDiag = document.querySelectorAll(".tb-diag-chk");
      const checkedDiag = document.querySelectorAll(".tb-diag-chk:checked").length;
      const diagEl = document.getElementById("tbDiagResult");
      if (diagEl && allDiag.length) {
        const hasSymptom =
          Boolean(document.getElementById("tbDiagChk_0")?.checked) ||
          Boolean(document.getElementById("tbDiagChk_1")?.checked);
        const hasSupport =
          Boolean(document.getElementById("tbDiagChk_4")?.checked) ||
          Boolean(document.getElementById("tbDiagChk_5")?.checked);
        const ready = hasSymptom && hasSupport && checkedDiag >= 3;
        diagEl.className = "score-pill " + (ready ? "alert-ok" : "alert-warn");
        diagEl.textContent = ready
          ? `Kriteria Diagnosa TB Paru: ${checkedDiag}/${allDiag.length} kriteria tercentang (Gejala & pemeriksaan penunjang/bakteriologis/radiologis mendukung)`
          : `Kriteria Diagnosa TB Paru: ${checkedDiag}/${allDiag.length} kriteria tercentang (lengkapi gejala klinis & pemeriksaan bakteriologis/radiologis)`;
      }
      const osceSelects = [...document.querySelectorAll(".tb-osce-select")];
      const osceEl = document.getElementById("tbOsceScoreResult");
      if (osceEl && osceSelects.length) {
        const maxScore = osceSelects.length * 3;
        const totalScore = osceSelects.reduce((sum, sel) => sum + (Number(sel.value) || 0), 0);
        const pct = Math.round((totalScore / maxScore) * 100);
        let statusText = "Perlu latihan & kelengkapan kompetensi";
        let cls = "alert-warn";
        if (pct >= 80) {
          statusText = "Sangat baik / Lulus OSCE optimal";
          cls = "alert-ok";
        } else if (pct >= 60) {
          statusText = "Memadai — perkuat rincian kompetensi bernilai < 3";
          cls = "alert-ok";
        } else if (totalScore === 0) {
          statusText = "Belum ada skor OSCE terpilih";
          cls = "alert-warn";
        } else {
          statusText = "Di bawah ambang aman — evaluasi anamnesis, pemeriksaan, tatalaksana & edukasi";
          cls = "alert-danger";
        }
        osceEl.className = "score-pill " + cls;
        osceEl.textContent = `Skor OSCE TB Paru: ${totalScore} / ${maxScore} poin (${pct}%) — ${statusText}`;
      }
      captureCurrentFormValues("tb_paru");
    }

          : `Kriteria Malaria Berat: 0/${allSev.length} tanda bahaya tercentang (Tidak ada tanda bahaya terpilih)`;

      captureCurrentFormValues("malaria");

      const el = document.getElementById("viralCriteriaResult");

    function updatePpokCalc() {
      const spiroOk = document.getElementById("ppokSpirometryChk")?.checked || false;
      const xrayOk = document.getElementById("ppokThoraxInfiltrateChk")?.checked || false;
      const gejalaCount = document.querySelectorAll(".ppok-gejala-chk:checked").length;
      const riskCount = document.querySelectorAll(".ppok-risk-chk:checked").length;
      const el = document.getElementById("ppokCriteriaResult");
      if (!el) return;
      const fullMet = spiroOk && gejalaCount >= 1 && riskCount >= 1;
      el.className = "score-pill " + (fullMet ? "alert-ok" : "alert-warn");
      el.textContent = fullMet
        ? `Kriteria Diagnostik PPOK TERPENUHI (Spirometri FEV1/FVC < 0,70 + ${gejalaCount}/3 gejala kronis + ${riskCount}/5 faktor risiko${xrayOk ? " + Foto Toraks Infiltrat" : ""})`
        : `Kriteria Diagnostik PPOK: Spirometri FEV1/FVC < 0,70 (${spiroOk ? "Tercentang" : "Belum"}) | Foto Toraks Infiltrat (${xrayOk ? "Tercentang" : "Belum"}) | Gejala kronis: ${gejalaCount}/3 | Faktor risiko: ${riskCount}/5`;
      captureCurrentFormValues("ppok");
    }

    function updatePpokGoldCalc() {
      const gold = document.getElementById("ppokGoldSelect")?.value || "GOLD 1";
      const el = document.getElementById("ppokGoldResult");
      if (!el) return;
      const map = {
        "GOLD 1": { text: "Derajat GOLD 1 (Ringan): FEV1 >= 80%", cls: "alert-ok" },
        "GOLD 2": { text: "Derajat GOLD 2 (Sedang): FEV1 50–79%", cls: "alert-warn" },
        "GOLD 3": { text: "Derajat GOLD 3 (Berat): FEV1 30–49%", cls: "alert-danger" },
        "GOLD 4": { text: "Derajat GOLD 4 (Sangat Berat): FEV1 < 30%", cls: "alert-danger" }
      };
      const info = map[gold] || map["GOLD 1"];
      el.className = "score-pill " + info.cls;
      el.textContent = info.text;
      captureCurrentFormValues("ppok");
    }

    function updatePuqeCalc() {
      const nausea = Number(document.getElementById("puqeNauseaSelect")?.value || 1);
      const vomit = Number(document.getElementById("puqeVomitSelect")?.value || 1);
      const retch = Number(document.getElementById("puqeRetchSelect")?.value || 1);
      const el = document.getElementById("puqeResult");
      if (!el) return;
      const total = nausea + vomit + retch;
      let label = "Ringan (<= 6)";
      let rec = "Tatalaksana suportif / rawat jalan";
      let cls = "alert-ok";
      if (total >= 13) {
        label = "Berat (13–15)";
        rec = "Indikasi rawat inap, rehidrasi IV, koreksi elektrolit & evaluasi komplikasi";
        cls = "alert-danger";
      } else if (total >= 7) {
        label = "Sedang (7–12)";
        rec = "Evaluasi ketonuria & status dehidrasi; pertimbangkan observasi/rawat inap";
        cls = "alert-warn";
      }
      el.className = "score-pill " + cls;
      el.textContent = `Skor PUQE: ${total} poin — Kategori: ${label} (${rec})`;
      captureCurrentFormValues("heg");
    }

    function updateHegChecklistCalc() {
      const all = document.querySelectorAll(".heg-chk");
      const checked = document.querySelectorAll(".heg-chk:checked").length;
      const el = document.getElementById("hegChecklistResult");
      if (!el || !all.length) return;
      el.className = "score-pill " + (checked > 0 ? "alert-ok" : "alert-warn");
      el.textContent = `Checklist Klinis HEG: ${checked}/${all.length} terverifikasi`;
      captureCurrentFormValues("heg");
    }

    function updateWoundCalc() {
      const all = document.querySelectorAll(".wound-chk");
      const checked = document.querySelectorAll(".wound-chk:checked").length;
      const el = document.getElementById("woundChecklistSummary");
      if (!el) return;
      el.className = "slide11-summary " + (checked > 0 ? "alert-ok" : "");
      el.textContent = `Checklist Terverifikasi: ${checked} / ${all.length} item`;
      captureCurrentFormValues("ulcus_luka_postop");
    }

    function updateSttCalc() {
      const all = document.querySelectorAll(".stt-chk");
      const checked = document.querySelectorAll(".stt-chk:checked").length;
      const el = document.getElementById("sttChecklistSummary");
      if (!el) return;
      el.className = "slide11-summary " + (checked > 0 ? "alert-ok" : "");
      el.textContent = `Checklist Terverifikasi: ${checked} / ${all.length} item`;
      captureCurrentFormValues(selectedId);
    }

    function updatePneumoniaCalc() {
      const xrayOk = document.getElementById("pneuXrayChk")?.checked || false;
      const gejalaCount = document.querySelectorAll(".pneu-gejala-chk:checked").length;
      const losOkCount = document.querySelectorAll(".pneu-los-chk:checked").length;
      const el = document.getElementById("pneuCriteriaResult");
      if (!el) return;
      const criteriaMet = xrayOk && gejalaCount >= 2;
      el.className = "score-pill " + (criteriaMet ? "alert-ok" : "alert-warn");
      el.textContent = criteriaMet
        ? `Syarat Diagnosis TERPENUHI (Foto Toraks + ${gejalaCount} gejala/lab) | Kesiapan LOS & Terapi: ${losOkCount}/3`
        : `Syarat Diagnosis BELUM LENGKAP (Foto Toraks: ${xrayOk ? "Ya" : "Belum"}, Gejala/Lab: ${gejalaCount}/2) | Kesiapan LOS & Terapi: ${losOkCount}/3`;
      captureCurrentFormValues("pneumonia");
    }

    function updateCurbCalc() {
      const score = [...document.querySelectorAll(".curb-chk:checked")].length;
      const el = document.getElementById("curbResult");
      if (!el) return;
      let rec = "Rawat Jalan";
      let cls = "alert-ok";
      if (score === 2) { rec = "Pertimbangkan Rawat Inap"; cls = "alert-warn"; }
      else if (score === 3) { rec = "Rawat Inap"; cls = "alert-warn"; }
      else if (score >= 4) { rec = "Pertimbangkan ICU"; cls = "alert-danger"; }
      el.className = "score-pill " + cls;
      el.textContent = `Skor CURB-65: ${score} -> ${rec} (0–1: Rawat Jalan | 2: Pertimbangkan Rawat Inap | >=3: Rawat Inap | 4–5: Pertimbangkan ICU)`;
      captureCurrentFormValues("pneumonia");
    }

    function updatePsiCalc() {
      const cat = document.getElementById("psiCategorySelect")?.value || "gt70";
      const extraFlags = [...document.querySelectorAll(".psi-chk:checked")].map((el) => el.parentElement.textContent.trim());
      const el = document.getElementById("psiResult");
      if (!el) return;
      if (cat === "gt70") {
        el.className = "score-pill alert-warn";
        el.textContent = "Skor PSI >70 -> Rawat inap direkomendasikan";
      } else if (extraFlags.length > 0) {
        el.className = "score-pill alert-warn";
        el.textContent = `Skor PSI <70 namun TETAP RAWAT INAP karena: ${extraFlags.join(", ")}`;
      } else {
        el.className = "score-pill alert-ok";
        el.textContent = "Skor PSI <70 tanpa tanda bahaya rawat inap tambahan";
      }
      captureCurrentFormValues("pneumonia");
    }

    function updateDengueCalc() {
      const grade = document.getElementById("dengueGrade")?.value || "DD";
      const leaks = [...document.querySelectorAll(".dengue-leak:checked")].length;
      const evals = [...document.querySelectorAll(".dengue-eval:checked")].length;
      const el = document.getElementById("dengueResult");
      if (!el) return;
      el.className = "score-pill " + (grade === "DBD III" || grade === "DBD IV" ? "alert-danger" : "alert-ok");
      el.textContent = `Derajat: ${grade} | Bukti Plasma Leakage terpilih: ${leaks}/4 | Evaluasi/Rawat Inap: ${evals}/4`;
      captureCurrentFormValues("dengue");
    }

    function updateNelwanCalc() {
      const total = [...document.querySelectorAll(".nelwan-chk:checked")].reduce((a, b) => a + Number(b.dataset.pts), 0);
      const el = document.getElementById("nelwanResult");
      if (!el) return;
      const ok = total >= 13;
      el.className = "score-pill " + (ok ? "alert-ok" : "alert-warn");
      el.textContent = `Total Skor Nelwan: ${total} — ${ok ? "Mengarah ke Diagnosis Tifoid (>= 13)" : "Belum mencapai ambang >= 13"}`;
      captureCurrentFormValues("typhoid");
    }

    function updateDaldiyonoCalc() {
      const total = [...document.querySelectorAll(".dal-chk:checked")].reduce((a, b) => a + Number(b.dataset.pts), 0);
      const el = document.getElementById("dalResult");
      if (!el) return;
      const iv = total >= 3;
      el.className = "score-pill " + (iv ? "alert-warn" : "alert-ok");
      el.textContent = `Skor Daldiyono: ${total} — ${iv ? "Skor >= 3 (Pertimbangkan cairan intravena IV / rawat inap)" : "Skor < 3 tanpa syok (Cairan peroral)"}`;
      captureCurrentFormValues("gea");
    }

    function updateSepsisCalc() {
      const sirs = [...document.querySelectorAll(".sirs-chk:checked")].length;
      const organ = document.getElementById("organDysfChk")?.checked;
      const shock = document.getElementById("refractoryShockChk")?.checked;
      const el = document.getElementById("sepsisResult");
      if (!el) return;
      let status = sirs >= 2 ? "Kriteria Sepsis Terpenuhi (Infeksi + >=2 SIRS)" : "SIRS < 2";
      let cls = sirs >= 2 ? "alert-warn" : "alert-ok";
      if (shock) { status = "SYOK SEPTIK (Hipotensi refrakter cairan + disfungsi organ)"; cls = "alert-danger"; }
      else if (organ && sirs >= 2) { status = "SEPSIS BERAT (Sepsis + disfungsi organ)"; cls = "alert-danger"; }
      el.className = "score-pill " + cls;
      el.textContent = `SIRS: ${sirs}/4 — ${status}`;
      captureCurrentFormValues("sepsis");
    }

    function updateMasldCalc() {
      const fib4 = document.getElementById("fib4Select")?.value || "low";
      const count = [...document.querySelectorAll(".masld-chk:checked")].length;
      const el = document.getElementById("masldResult");
      if (!el) return;
      const eligible = fib4 === "high" && count >= 3;
      el.className = "score-pill " + (eligible ? "alert-ok" : "alert-warn");
      el.textContent = eligible
        ? `FIB-4 >= 1,3 + ${count}/5 kriteria MASLD -> Dapat diajukan ke BPJS`
        : `FIB-4 (${fib4 === "high" ? ">=1,3" : "<1,3"}) + ${count}/5 kriteria MASLD -> ${fib4 === "low" ? "TIDAK diajukan sebagai diagnosis sekunder" : "Lengkapi minimal 3/5 kriteria MASLD"}`;
      captureCurrentFormValues("masld");
    }

    function updateRoleFeedback() {
      const fb = document.getElementById("roleFeedback");
      if (fb) {
        fb.textContent = roleFeedbackMsg;
      }
    }

    function escapeHtmlAttr(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function renderDetail() {
      const filtered = getFilteredDiagnoses();
      const panel = document.getElementById("detailPanel");

      if (!filtered.length) {
        panel.className = "panel";
        panel.innerHTML = `<div class="alert alert-warn">Tidak ada diagnosis yang cocok dengan filter pencarian/kategori.</div>`;
        return;
      }

      const diag = selectedId ? DIAGNOSES.find((d) => d.id === selectedId) : null;
      if (!diag) {
        panel.className = "panel";
        panel.innerHTML = `<div class="alert alert-warn">Silakan pilih <strong>-diagnosa-</strong> atau ketik kata kunci pencarian untuk menampilkan detail kriteria, ICD-10, dan tarif E-Klaim.</div>`;
        return;
      }
      const isExcluded = Boolean(diag.excluded);
      const adjustedClaim = getAdjustedClaim(diag.claim);

      panel.className = isExcluded ? "panel panel-excluded" : "panel";

      panel.innerHTML = `
        <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px; align-items:flex-start;">
          <div>
            <span class="badge">${diag.category}</span>
            <h2 style="margin:6px 0 2px; font-size:1.25rem;">${diag.name}</h2>
            <div class="excluded-muted" style="font-size:0.88rem; color:${isExcluded ? "#991b1b" : "var(--muted)"};">Kode ICD-10: <strong>${diag.icd10}</strong></div>
          </div>
          <div class="top-right-controls">
            <div class="blue-action-group">
              <button
                id="topEditBtn"
                class="btn-blue-pill ${isHeaderCardEditing ? "is-active" : ""}"
                type="button"
                onclick="handleTopEditClick()"
                title="Edit Nama Diagnosis, ICD-10 & Catatan"
              >
                ✏️ Edit
              </button>
              <button
                id="topLockBtn"
                class="btn-blue-pill ${isHeaderCardUnlocked ? "is-active" : ""}"
                type="button"
                onclick="handleTopLockClick()"
                title="${isHeaderCardUnlocked ? "Kunci kembali bagian diagnosis" : "Buka kunci edit diagnosis"}"
              >
                ${isHeaderCardUnlocked ? "🔓 Terbuka" : "🔒 Kunci"}
              </button>
            </div>
            <div style="text-align:right;">
              <div class="excluded-muted" style="font-size:0.78rem; color:${isExcluded ? "#991b1b" : "var(--muted)"};">Estimasi Klaim (E-Klaim)</div>
              <div style="font-size:1.1rem; font-weight:700; color:${isExcluded ? "var(--danger-text)" : "var(--primary)"};">${formatRp(adjustedClaim)}</div>
            </div>
          </div>
        </div>

        ${
          !isHeaderCardUnlocked && showHeaderUnlockPrompt
            ? `
            <div class="header-edit-box">
              <div style="font-size:0.84rem; font-weight:700; color:#1e3a8a;">Buka Kunci Edit Diagnosis</div>
              <div class="header-unlock-row">
                <input
                  id="headerUnlockPassword"
                  type="password"
                  placeholder="Masukkan password buka kunci"
                  style="flex:1 1 200px;"
                  onkeydown="if(event.key==='Enter'){event.preventDefault();unlockHeaderCard();}"
                />
                <button class="btn-accent" type="button" onclick="unlockHeaderCard()">Buka Kunci</button>
              </div>
              <div id="headerLockMsg" class="lock-msg"></div>
            </div>
          `
            : ""
        }

        ${
          isHeaderCardUnlocked && isHeaderCardEditing
            ? `
            <div class="header-edit-box">
              <div style="font-size:0.84rem; font-weight:700; color:#1e3a8a; margin-bottom:8px;">Edit &amp; Ketik Langsung Detail Diagnosis</div>
              <div class="header-edit-grid">
                <div class="header-edit-field">
                  <label for="headerEditNameInput">Nama Diagnosis</label>
                  <input id="headerEditNameInput" type="text" value="${escapeHtmlAttr(diag.name)}" />
                </div>
                <div class="header-edit-field">
                  <label for="headerEditIcdInput">Kode ICD-10</label>
                  <input id="headerEditIcdInput" type="text" value="${escapeHtmlAttr(diag.icd10)}" />
                </div>
              </div>
              <div class="header-edit-field" style="margin-bottom:10px;">
                <label for="headerEditNoteInput">Catatan Klinis / Regulasi</label>
                <textarea id="headerEditNoteInput">${escapeHtmlAttr(diag.note)}</textarea>
              </div>
              <div style="display:flex; flex-wrap:wrap; gap:8px; align-items:center;">
                <button class="btn-accent" type="button" onclick="saveHeaderCardEdit('${diag.id}')">Simpan Editan</button>
                <button type="button" onclick="cancelHeaderCardEdit()">Batal</button>
              </div>
              <div id="headerLockMsg" class="lock-msg"></div>
            </div>
          `
            : headerLockMsgText
              ? `<div id="headerLockMsg" class="lock-msg"></div>`
              : ""
        }

        ${
          isExcluded
            ? `<div class="alert alert-danger">PERINGATAN: ${diag.note}</div>`
            : `<div class="alert alert-ok">${diag.note}</div>`
        }

        <div class="excluded-proc-line" style="font-size:0.88rem; margin-top:8px;">
          <strong>Tindakan / Prosedur / Penunjang:</strong> ${diag.procedures}
        </div>

        ${renderInteractiveModule(diag)}

        ${renderTariffAdjustmentCard(diag)}

        <div id="roleFeedback" class="role-feedback"></div>

        <div class="action-bar">
          <button class="btn-save" type="button" onclick="saveAllData(true)">Simpan Data</button>
          <button class="btn-download" type="button" onclick="downloadDiagnosisTxt('${diag.id}')">Download (.TXT)</button>
          <button class="btn-reset-soft" type="button" onclick="resetDiagData('${diag.id}')">Reset Input Diagnosis</button>
        </div>
      `;

      restoreFormValues(diag.id);

      document.querySelectorAll("#detailPanel input[type='checkbox']").forEach((chk) => {
        chk.addEventListener("change", () => saveAllData(false));
      });
      document.querySelectorAll("#detailPanel select").forEach((sel) => {
        sel.addEventListener("change", () => saveAllData(false));
      });

      updatePebSevereCalc();
      updateBacterialInfCalc();
      updateAsmaCalc();
      updateIskCalc();
      updateTbParuCalc();
      updateMalariaCalc();
      updateViralInfCalc();
      updatePpokCalc();
      updatePpokGoldCalc();
      updatePuqeCalc();
      updateHegChecklistCalc();
      updatePneumoniaCalc();
      updateCurbCalc();
      updatePsiCalc();
      updateDengueCalc();
      updateNelwanCalc();
      updateDaldiyonoCalc();
      updateSepsisCalc();
      updateMasldCalc();
      updateWoundCalc();
      updateSttCalc();
      updateInacbgsCalc();
      renderHeaderLockMsg();
      renderTariffLockMsg();
      updateRoleFeedback();
    }

    function selectDiagnosis(id) {
      captureCurrentFormValues(selectedId);
      selectedId = id || "";
      isHeaderCardEditing = false;
      showHeaderUnlockPrompt = false;
      headerLockMsgText = "";
      roleFeedbackMsg = "";
      saveAllData(false);
      syncDiagnosisSelector();
      renderDetail();
    }

    document.getElementById("searchInput").addEventListener("input", () => {
      syncDiagnosisSelector();
      renderDetail();
    });

    document.getElementById("categoryFilter").addEventListener("change", () => {
      syncDiagnosisSelector();
      renderDetail();
    });

    document.getElementById("diagQuickSelect").addEventListener("change", (e) => {
      selectDiagnosis(e.target.value);
    });

    document.getElementById("eclaimClassSelect").addEventListener("change", () => {
      saveAllData(false);
      syncDiagnosisSelector();
      renderDetail();
    });

    document.getElementById("resetFilterBtn").addEventListener("click", () => {
      document.getElementById("searchInput").value = "";
      document.getElementById("categoryFilter").value = "ALL";
      document.getElementById("eclaimClassSelect").value = "";
      selectedId = "";
      isHeaderCardEditing = false;
      showHeaderUnlockPrompt = false;
      headerLockMsgText = "";
      savedState.selectedId = "";
      savedState.tariffMultiplier = "";
      saveAllData(false);
      syncDiagnosisSelector();
      renderDetail();
    });

    applySavedOverridesToDiagnoses();
    const classSel = document.getElementById("eclaimClassSelect");
    if (savedState.tariffMultiplier && [...classSel.options].some((o) => o.value === savedState.tariffMultiplier)) {
      classSel.value = savedState.tariffMultiplier;
    } else {
      classSel.value = "";
    }
    selectedId = DIAGNOSES.some((d) => d.id === savedState.selectedId) ? savedState.selectedId : "";
    syncDiagnosisSelector();
    renderDetail();
  </script>
</body>
</html>
